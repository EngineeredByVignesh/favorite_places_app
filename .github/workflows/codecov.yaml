name: coverage
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate coverage (dummy for now)
      - name: Generate coverage
        run: echo "ok" > coverage.txt

      # Install Codecov uploader
      - name: Download Codecov uploader
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov

      # Upload coverage using GitHub App (no token needed)
      - name: Upload coverage to self-hosted Codecov
        run: |
          ./codecov -f coverage.txt -U -y codecov.yml -R . \
            -u https://unerodent-milkier-isis.ngrok-free.dev
