# .github/workflows/coverage.yml
name: PR Coverage

on:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to detect commits for coverage

      # 2️⃣ Generate coverage (for now, a dummy file)
      - name: Generate dummy coverage
        run: |
          echo "dummy coverage" > coverage.txt

      # 3️⃣ Download Codecov uploader
      - name: Download Codecov uploader
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
      - name: Upload coverage
        run: |
          ./codecov -f coverage.txt -t ${{ secrets.CODECOV_TOKEN }} \
            -u https://unerodent-milkier-isis.ngrok-free.dev
